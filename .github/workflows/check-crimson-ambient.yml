name: Check Crimson01 Ambient

on:
  push:
    branches: [main]
    paths:
      - "main.lua"
      - "README.md"
      - ".github/workflows/check-crimson-ambient.yml"
  pull_request:
    paths:
      - "main.lua"
      - ".github/workflows/check-crimson-ambient.yml"

permissions:
  contents: read

jobs:
  ambient:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leafo/gh-actions-lua@v11
        with:
          luaVersion: "5.1"
      - name: Verify production loader syntax
        run: luac -p main.lua
      - name: Regression check for the particle upgrade
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('main.lua').read_text()
          assert 'MrRos3/VantaUI/main/dist/main.lua' in source or 'MrRos3/VantaUI/main/dist/main.lua?v=' in source
          assert 'CRIMSON_AMBIENT_FPS = 30' in source
          counts = {'Petal': 18, 'Ember': 17, 'Mote': 10, 'Glint': 5}
          for name, count in counts.items():
              assert f'{name} = {count}' in source
          assert sum(counts.values()) == 50
          assert 'for _, kind in ipairs({ "Petal", "Ember", "Mote", "Glint" }) do' in source
          assert 'RunService.RenderStepped:Connect(function(dt)' in source
          assert 'frameAccumulator < (1 / CRIMSON_AMBIENT_FPS)' in source
          assert 'frameAccumulator = 0' in source
          assert 'elapsed = elapsed + frameAccumulator' in source
          assert 'overlay.ClipsDescendants = true' in source
          assert 'overlay.Active = false' in source
          assert 'if window.Closed or not main.Visible then' in source
          assert 'overlay.Visible = false' in source
          assert 'overlay.Visible = true' in source
          assert 'if connection then connection:Disconnect(); connection = nil end' in source
          assert 'if overlay.Parent then overlay:Destroy() end' in source
          block = source.split('function window:Close(...)', 1)[1].split('end',1)[0]
          assert block.index('ambient.Visible = false') < block.index('closeOriginal(self, ...)')
          assert 'local usesThemeWallpaper = config.Background == nil and config.AnimatedBackground == nil' in source
          assert 'https://raw.githubusercontent.com/MrRos3/VantaUI/main/assets/crimson01-hq.jpg' in source
          assert 'MrRos3/VantaTest' not in source
          assert 'Vanta Chat' not in source
          print('Crimson01 production code, bounded pool, minimize lifecycle, and VantaUI identity checked.')
          PY
